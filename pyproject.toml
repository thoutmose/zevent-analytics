[project]
name = "zevent-analytics"
version = "0.1.0"
description = "Multi-channel Zevent/Twitch extractor feeding a NiFi -> PostgreSQL bronze pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "twitchio>=3.3.2",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "pyarrow>=25.0.1",
    "colorlog>=6.12.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff==0.16.6",
    "ty==0.0.80",
    "sqlfluff==4.3.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "bandit>=1.8",
    "pip-audit>=2.7",
]
# Transformation layer (dbt/, reads bronze_* in `public`, writes stg/int/marts —
# see dbt/dbt_project.yml). Separate group from dev: this is a data-modeling
# concern, not a code-quality tool for the extractors above.
dbt = [
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "elementary-data>=0.16",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.sqlfluff.core]
dialect = "postgres"
# LT01/LT05: the schema's column-aligned style (matching this repo's dataclass
# field style) is intentional, not a lint gap.
exclude_rules = ["LT01", "LT05"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
# B311: random.uniform/randint here are reconnect jitter and an anonymous IRC
# nick suffix, not security-sensitive — not a candidate for secrets.SystemRandom.
skips = ["B311"]
