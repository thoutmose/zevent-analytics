name: CD (srv-prod)

# Deploys only the NiFi stack (docker-compose.yml + drivers/) into the same
# checkout that main.py/zevent_api.py run from on srv-prod (see README.md) —
# it doesn't touch those scripts, which are started on demand, independent
# of this pipeline. Never triggers directly off `push`: it waits for the CI
# workflow on main to report success, so a red build can never reach prod.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # manual re-run from the Actions tab if needed

permissions:
  contents: read

concurrency:
  # Never let two deploys race each other against the same server.
  group: cd-srv-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy NiFi stack to srv-prod
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Requires a "production" environment in repo Settings -> Environments,
    # with required reviewers configured — this is what turns every deploy
    # into a manual-approval gate. See DEPLOYMENT.md.
    environment:
      name: production
      url: https://${{ vars.SRV_PROD_NIFI_HOSTNAME || 'nifi.thoutmose.me' }}
    steps:
      - uses: actions/checkout@v5

      # srv-prod is only reachable over Tailscale (SRV_PROD_HOST is its
      # tailnet IP), not the public internet — the hosted runner needs to
      # join the tailnet before any SSH step can reach it. TAILSCALE_AUTHKEY
      # should be an ephemeral, expiring auth key (Tailscale admin console ->
      # Settings -> Keys), not a permanent one.
      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SRV_PROD_SSH_KEY }}

      - name: Pin known host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # SRV_PROD_KNOWN_HOSTS is the output of:
          #   ssh-keyscan -p <port> <host>
          # run once when srv-prod is provisioned. Pinning it here (instead of
          # StrictHostKeyChecking=no) is what stops a MITM'd/spoofed host from
          # silently accepting the deploy key. See DEPLOYMENT.md.
          echo "${{ secrets.SRV_PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync NiFi stack files
        env:
          SRV_PROD_HOST: ${{ secrets.SRV_PROD_HOST }}
          SRV_PROD_USER: ${{ secrets.SRV_PROD_USER }}
          SRV_PROD_SSH_PORT: ${{ secrets.SRV_PROD_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.SRV_PROD_DEPLOY_PATH || '/opt/twitch-analytics' }}
        run: |
          ssh -p "$SRV_PROD_SSH_PORT" "$SRV_PROD_USER@$SRV_PROD_HOST" \
            "mkdir -p '$DEPLOY_PATH/drivers' '$DEPLOY_PATH/nifi/dead-letter'"

          # NIFI_ADMIN_USERNAME/PASSWORD and NIFI_WEB_PROXY_HOST live in the
          # .env already sitting in $DEPLOY_PATH (the same .env the Python
          # extractors use) — provisioned once by hand and never touched by
          # CI. See DEPLOYMENT.md. Only the stack definition and driver jar
          # are synced. nifi/dead-letter/ is deliberately excluded: it's a
          # live volume mount with production dead-letter output, not a
          # deploy artifact. $DEPLOY_PATH is writable by the deploy user only
          # for these NiFi-owned paths (docker-compose.yml, drivers/, nifi/)
          # via a shared group — see DEPLOYMENT.md. --inplace: deploy has
          # write on docker-compose.yml itself but not on $DEPLOY_PATH's top
          # level (that's thoutmose's checkout root), so rsync's default
          # write-a-temp-file-then-rename approach fails — it needs write on
          # the containing directory for that, not just the file.
          # --no-owner --no-group --no-perms --no-times: -a's default
          # attribute preservation tries to chgrp/chmod/set mtime on the
          # destination to match the source, all of which require being the
          # file's owner (or root) — deploy only has group write via a
          # shared group, not ownership, so every one of those fails. Group
          # is already fixed up once, by hand, on srv-prod; content is all
          # that needs to actually transfer.
          rsync -rz --inplace --no-owner --no-group --no-perms --no-times \
            -e "ssh -p $SRV_PROD_SSH_PORT" \
            docker-compose.yml \
            "$SRV_PROD_USER@$SRV_PROD_HOST:$DEPLOY_PATH/docker-compose.yml"

          rsync -rz --delete --no-owner --no-group --no-perms --no-times \
            -e "ssh -p $SRV_PROD_SSH_PORT" \
            drivers/ \
            "$SRV_PROD_USER@$SRV_PROD_HOST:$DEPLOY_PATH/drivers/"

      - name: Sync Python source files
        # main.py/zevent_api.py/zevent_donation_goals.py run as systemd
        # services (zevent-*-prod), started independently of this pipeline
        # (see README.md "Running as a service") but living in the same
        # checkout DEPLOY_PATH points at. archive_parquet.py/archive_logs.py
        # run instead off an hourly cron job that just re-execs the file on
        # disk each time, so syncing them here is the entire fix for those -
        # no restart step needed. Same --inplace/no-owner etc. reasoning as
        # docker-compose.yml above: deploy has group write on each of these
        # files (and sql/, set up the same way as drivers/) but not on
        # DEPLOY_PATH's top level.
        env:
          SRV_PROD_HOST: ${{ secrets.SRV_PROD_HOST }}
          SRV_PROD_USER: ${{ secrets.SRV_PROD_USER }}
          SRV_PROD_SSH_PORT: ${{ secrets.SRV_PROD_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.SRV_PROD_DEPLOY_PATH || '/opt/twitch-analytics' }}
        run: |
          rsync -rz --inplace --no-owner --no-group --no-perms --no-times \
            -e "ssh -p $SRV_PROD_SSH_PORT" \
            main.py zevent_api.py zevent_donation_goals.py emote_catalog.py \
            nifi_client.py http_config.py logging_setup.py \
            archive_common.py archive_parquet.py archive_logs.py \
            run_dbt.sh \
            pyproject.toml uv.lock logging.yaml \
            "$SRV_PROD_USER@$SRV_PROD_HOST:$DEPLOY_PATH/"

          rsync -rz --delete --no-owner --no-group --no-perms --no-times \
            -e "ssh -p $SRV_PROD_SSH_PORT" \
            sql/ \
            "$SRV_PROD_USER@$SRV_PROD_HOST:$DEPLOY_PATH/sql/"

          # dbt/target, dbt/dbt_packages, dbt/logs, dbt/.user.yml are all
          # gitignored/regenerated by `dbt deps`/`dbt build` on srv-prod
          # itself (see run_dbt.sh) — never synced, so a stale local build
          # artifact can't shadow what the dbt CLI regenerates there.
          rsync -rz --delete --no-owner --no-group --no-perms --no-times \
            --exclude target/ --exclude dbt_packages/ --exclude logs/ --exclude .user.yml \
            -e "ssh -p $SRV_PROD_SSH_PORT" \
            dbt/ \
            "$SRV_PROD_USER@$SRV_PROD_HOST:$DEPLOY_PATH/dbt/"

      - name: Apply database migrations
        # Every file in sql/ is written to be idempotent (CREATE TABLE IF NOT
        # EXISTS / ADD COLUMN IF NOT EXISTS) specifically so it's safe to
        # re-run on every single deploy, not just once — any new migration
        # added to sql/ from now on must keep that property. Runs from a
        # throwaway postgres:16 container on srv-prod (docker's already there
        # for NiFi) rather than assuming a psql client is installed on the
        # host. --env-file (not -e KEY=value) keeps the password out of the
        # process argument list — see DEPLOYMENT.md's ".env.postgres on
        # srv-prod" for how that file is provisioned (never by CD).
        env:
          SRV_PROD_HOST: ${{ secrets.SRV_PROD_HOST }}
          SRV_PROD_USER: ${{ secrets.SRV_PROD_USER }}
          SRV_PROD_SSH_PORT: ${{ secrets.SRV_PROD_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.SRV_PROD_DEPLOY_PATH || '/opt/twitch-analytics' }}
        run: |
          ssh -p "$SRV_PROD_SSH_PORT" "$SRV_PROD_USER@$SRV_PROD_HOST" "
            set -euo pipefail
            cd '$DEPLOY_PATH'
            for f in sql/*.sql; do
              echo \"Applying \$f\"
              docker run --rm --env-file .env.postgres \
                -v \"\$(pwd)/\$f:/migration.sql:ro\" \
                postgres:16 psql -v ON_ERROR_STOP=1 -f /migration.sql
            done
          "

      - name: Apply stack (docker compose up -d)
        env:
          SRV_PROD_HOST: ${{ secrets.SRV_PROD_HOST }}
          SRV_PROD_USER: ${{ secrets.SRV_PROD_USER }}
          SRV_PROD_SSH_PORT: ${{ secrets.SRV_PROD_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.SRV_PROD_DEPLOY_PATH || '/opt/twitch-analytics' }}
        run: |
          ssh -p "$SRV_PROD_SSH_PORT" "$SRV_PROD_USER@$SRV_PROD_HOST" "
            set -euo pipefail
            cd '$DEPLOY_PATH'
            # --env-file .env.nifi on both: Compose parses/interpolates the
            # whole compose file up front regardless of subcommand, so even
            # 'pull' needs it, not just 'up'. NIFI_ADMIN_USERNAME/PASSWORD
            # and NIFI_WEB_PROXY_HOST live in their own file, readable by
            # the deploy user's group — deploy must never be able to read
            # the main .env, which also holds the Python extractors'
            # Twitch/Postgres secrets. See DEPLOYMENT.md.
            docker compose --env-file .env.nifi pull
            docker compose --env-file .env.nifi up -d --remove-orphans
            # Unconditional restart, not just 'up -d': Compose only recreates
            # a container whose own image/config changed, which a SQL-only
            # migration above never does. PutDatabaseRecord's cached table
            # schema needs a real restart to see new/changed columns, every
            # time — see ARCHITECTURE.md step 6a and sql/003's header for the
            # incident this fixes for good, instead of relying on someone
            # remembering to do it by hand after every schema change.
            docker compose --env-file .env.nifi restart nifi
          "

      - name: NiFi health check
        env:
          SRV_PROD_HOST: ${{ secrets.SRV_PROD_HOST }}
          SRV_PROD_USER: ${{ secrets.SRV_PROD_USER }}
          SRV_PROD_SSH_PORT: ${{ secrets.SRV_PROD_SSH_PORT || '22' }}
        run: |
          ssh -p "$SRV_PROD_SSH_PORT" "$SRV_PROD_USER@$SRV_PROD_HOST" "
            for i in \$(seq 1 10); do
              if curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/nifi/ | grep -qE '^(200|302)$'; then
                echo 'NiFi UI is up'
                exit 0
              fi
              echo \"waiting for NiFi (attempt \$i/10)...\"
              sleep 10
            done
            echo 'NiFi did not come up in time' >&2
            exit 1
          "

      - name: Refresh deps & restart zevent services
        # deploy has exactly two sudo grants for this, set up by hand on
        # srv-prod (see /etc/sudoers.d/twitch-deploy, DEPLOYMENT.md): running
        # `uv sync` as thoutmose (the venv's owner, and the user these units
        # run as - see each unit's User= directive) and restarting these
        # three units as root (required for a system-level unit regardless
        # of its own User=). Nothing broader than that is granted.
        env:
          SRV_PROD_HOST: ${{ secrets.SRV_PROD_HOST }}
          SRV_PROD_USER: ${{ secrets.SRV_PROD_USER }}
          SRV_PROD_SSH_PORT: ${{ secrets.SRV_PROD_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.SRV_PROD_DEPLOY_PATH || '/opt/twitch-analytics' }}
        run: |
          ssh -p "$SRV_PROD_SSH_PORT" "$SRV_PROD_USER@$SRV_PROD_HOST" "
            set -euo pipefail
            sudo -u thoutmose /home/thoutmose/.local/bin/uv sync --frozen --directory '$DEPLOY_PATH'
            sudo systemctl restart zevent-api-prod
            sudo systemctl restart zevent-donation-goals-prod
            sudo systemctl restart zevent-main-prod
          "

      - name: Zevent services health check
        env:
          SRV_PROD_HOST: ${{ secrets.SRV_PROD_HOST }}
          SRV_PROD_USER: ${{ secrets.SRV_PROD_USER }}
          SRV_PROD_SSH_PORT: ${{ secrets.SRV_PROD_SSH_PORT || '22' }}
        run: |
          ssh -p "$SRV_PROD_SSH_PORT" "$SRV_PROD_USER@$SRV_PROD_HOST" "
            for unit in zevent-api-prod zevent-donation-goals-prod zevent-main-prod; do
              for i in \$(seq 1 10); do
                if [ \"\$(systemctl is-active \"\$unit\")\" = 'active' ]; then
                  echo \"\$unit is active\"
                  break
                fi
                if [ \"\$i\" = 10 ]; then
                  echo \"\$unit did not become active in time\" >&2
                  exit 1
                fi
                echo \"waiting for \$unit (attempt \$i/10)...\"
                sleep 5
              done
            done
          "

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "### Deploy to srv-prod"
            echo "- Triggered by: ${{ github.event_name }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
